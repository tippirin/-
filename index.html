<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f242c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タスクボード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>タスクボード</title>
<style id="css">
:root{--bg:#f3f5f8;--panel:#fff;--text:#1f2633;--sub:#6b7586;--line:#e3e7ee;--accent:#3d8bea;--danger:#e5484d;--col:#eaedf2;--wkend:#fffbea;--sun:#e5484d;--sat:#3d7be5;--stripe:rgba(120,135,160,.09)}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--panel:#1f242c;--text:#e8ecf2;--sub:#9aa4b5;--line:#2e3540;--col:#181c22;--wkend:#23241c;--stripe:rgba(255,255,255,.04)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
#root{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--panel);border-bottom:1px solid var(--line);flex:none;display:flex;align-items:center;padding-top:env(safe-area-inset-top)}
.tabs{flex:1;min-width:0}
.gear{flex:none;border:0;background:none;color:var(--sub);padding:8px 12px;display:grid;place-items:center}
.gear svg{width:22px;height:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tab.on:not(.nomenu)::after{content:" ▾";font-size:10px}
.tab.add{color:var(--accent);font-weight:700;padding:6px 12px}
main{flex:1;min-height:0;position:relative;overflow:hidden}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex:none}
nav button{flex:1;min-width:0;white-space:nowrap;letter-spacing:-.02em;border:0;background:none;color:var(--sub);padding:7px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent);font-weight:700}
/* board */
.board{position:absolute;inset:0;display:flex;gap:12px;overflow-x:auto;padding:12px;align-items:flex-start}
.col{flex:none;width:min(84vw,300px);max-height:100%;display:flex;flex-direction:column;background:var(--col);border-radius:10px;border-top:4px solid var(--c)}
.col-head{display:flex;align-items:center;gap:6px;padding:9px 4px 6px 12px;font-weight:700}
.col-head .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-head .cnt{color:var(--c)}
.icon{border:0;background:none;color:var(--sub);font-size:18px;padding:2px 10px;margin-left:auto;border-radius:6px;line-height:1}
.add-row{display:flex;gap:6px;margin:0 8px 8px}
.add-row .add-task{flex:1;margin:0}
.add-bulk{flex:none;border:0;background:var(--panel);color:var(--accent);border-radius:8px;padding:9px 10px;font-size:13px;white-space:nowrap}
.bulk-n{font-size:12px;color:var(--sub);margin:-6px 0 8px}
.add-task{margin:0 8px 8px;border:0;background:var(--panel);color:var(--accent);border-radius:8px;padding:9px;font-size:14px}
.col-body{overflow-y:auto;padding:0 8px 10px;min-height:44px;flex:1 1 auto}
.card-wrap{position:relative;margin-bottom:8px;border-radius:8px;overflow:hidden}
.card-del{position:absolute;inset:0;display:flex;justify-content:flex-end;background:var(--danger);visibility:hidden}
.card-wrap.sw .card-del{visibility:visible}
.card-del button{width:80px;border:0;background:none;color:#fff;font-weight:700;font-size:14px}
.card{position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--panel);padding:10px;border-radius:8px;border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s}
.chk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #b3bcc9;background:none;padding:0;margin-top:1px;display:grid;place-items:center}
.card.done .chk,.day-item.done .chk{background:var(--accent);border-color:var(--accent)}
.card.done .chk::after,.day-item.done .chk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translate(0,-1px) rotate(45deg)}
.card-main{flex:1;min-width:0}
.title{font-size:15px;line-height:1.4;word-break:break-word;white-space:pre-wrap}
.meta{font-size:12px;color:var(--sub);margin-top:4px}
.meta.over{color:var(--danger)}
.card.done .card-main{text-decoration:line-through;opacity:.45}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.28);transform:rotate(2deg);opacity:.95;margin:0}
.ph{border:2px dashed var(--accent);border-radius:8px;margin-bottom:8px;background:rgba(61,139,234,.07)}
.col-head{touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.col-ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.3);transform:rotate(2deg);opacity:.95;margin:0;overflow:hidden}
.col-ph{flex:none;border:2px dashed var(--accent);border-radius:10px;background:rgba(61,139,234,.07);align-self:flex-start}
.add-input{display:block;width:100%;margin:0 0 8px;padding:10px;border-radius:8px;border:2px solid var(--accent);font:inherit;font-size:16px;background:var(--panel);color:var(--text);outline:none}
.add-col{background:none;border:2px dashed var(--line)}
.add-col button{border:0;background:none;color:var(--sub);padding:14px;font-size:14px;width:100%}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.sheet h3{margin:0 0 12px;font-size:17px}
.fld{display:block;margin-bottom:12px;font-size:12px;color:var(--sub)}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;resize:vertical}
.row2{display:flex;gap:10px;margin-bottom:6px}.row2>*{flex:1;min-width:0}
.btns{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;background:var(--bg);color:var(--text)}
.btn.pri{background:var(--accent);color:#fff}
.btn.dan{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.35}
.link{border:0;background:none;color:var(--accent);font-size:13px;padding:0 0 10px}
.menu-item{display:block;width:100%;text-align:left;border:0;background:none;font-size:15px;color:var(--text);padding:13px 4px;border-bottom:1px solid var(--line)}
.menu-item.dan{color:var(--danger)}
.colors{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 14px}
.sw-c{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--panel)}
.sw-c.on{border-color:var(--text)}
.chkrow{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:15px}
.chkrow input{width:20px;height:20px}
.msg{font-size:15px;line-height:1.6;margin:0 0 8px}
.day-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dt{flex:1;min-width:0;word-break:break-word}
.day-item.done .dt{text-decoration:line-through;opacity:.45}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#232b37;color:#fff;padding:10px 14px;border-radius:10px;display:flex;gap:16px;align-items:center;z-index:200;transition:.2s;font-size:14px;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#8fc0ff;font-weight:700;font-size:14px;padding:0}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;line-height:1;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:10}
/* gantt */
.g-wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.g-tool{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.seg{display:flex;border:1px solid var(--accent);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;color:var(--accent);padding:5px 12px;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.small-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:5px 12px;font-size:13px}
.hint{font-size:11px;color:var(--sub);margin-left:auto;text-align:right}
.gantt{flex:1;overflow:auto;position:relative;background:var(--panel)}
.g-inner{position:relative;display:flex;flex-direction:column;min-height:100%}
.g-head{position:sticky;top:0;z-index:5;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.g-corner{position:sticky;left:0;z-index:6;width:var(--lw);flex:none;background:var(--panel);border-right:1px solid var(--line);font-size:11px;color:var(--sub);display:flex;align-items:flex-end;padding:6px 8px}
.g-scale{position:relative;height:52px;flex:none}
.g-mon{position:absolute;top:0;height:22px;font-size:12px;font-weight:700;padding:3px 6px;border-left:1px solid var(--line);white-space:nowrap}
.g-day{position:absolute;top:22px;height:30px;text-align:center;font-size:11px;line-height:14px;padding-top:1px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.g-day.r{color:var(--sun)}.g-day.b{color:var(--sat)}
.g-day.t{background:var(--accent);color:#fff;font-weight:700}
.g-body{position:relative;flex:1;display:flex;flex-direction:column}
.g-row.fill{flex:1;height:auto;border-bottom:0}
.g-stripes{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px)}
.g-stripe{position:absolute;top:0;bottom:0;background:var(--stripe)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.6}
.g-row{position:relative;z-index:1;display:flex;height:34px;border-bottom:1px solid var(--line)}
.g-name{position:sticky;left:0;z-index:3;width:var(--lw);flex:none;background:var(--panel);border-right:1px solid var(--line);font-size:12px;padding:0 8px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.g-name span{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.g-row.done .g-name span{text-decoration:line-through;opacity:.45}
.g-row.grp .g-name{background:var(--c);color:#fff;font-weight:700}
.g-row.grp .g-track{background:color-mix(in srgb,var(--c) 13%,transparent)}
.caret{font-style:normal;font-size:11px}
.g-track{position:relative;flex:none}
.g-bar{position:absolute;top:7px;height:20px;border-radius:4px;background:var(--c);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.g-bar.done{opacity:.35}
.g-bar.drag{box-shadow:0 0 0 2px var(--text),0 4px 10px rgba(0,0,0,.25);z-index:2}
.g-empty{position:absolute;left:6px;top:9px;font-size:11px;color:var(--sub);pointer-events:none;white-space:nowrap;opacity:.7}
/* calendar */
.cal{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.cal-top{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.cal-top b{font-size:18px;margin:0 6px}
.nav-b{border:0;background:none;color:var(--text);font-size:24px;padding:0 10px;line-height:1}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;text-align:center;color:var(--sub);padding:5px 0;border-bottom:1px solid var(--line);flex:none}
.cal-body{flex:1;overflow-y:auto;touch-action:pan-y;padding-bottom:84px}
.cal-week{position:relative;border-bottom:1px solid var(--line)}
.cal-cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{position:relative;border-right:1px solid var(--line);padding:2px;text-align:center}
.cal-cell:last-child{border-right:0}
.cal-cell.we{background:var(--wkend)}
.cal-num{font-size:13px;font-weight:600;display:inline-block;min-width:22px;height:22px;line-height:22px;border-radius:11px;padding:0 3px}
.cal-num.r{color:var(--sun)}.cal-num.b{color:var(--sat)}
.cal-cell.out .cal-num{opacity:.35}
.cal-cell.today .cal-num{background:var(--accent);color:#fff}
.cal-more{position:absolute;bottom:1px;left:0;right:0;font-size:10px;color:var(--sub)}
.cal-ev{position:absolute;pointer-events:none;height:18px;font-size:11px;line-height:18px;color:#fff;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:var(--c);border-radius:3px;margin-left:1px}
.cal-ev.hol{background:#3f9a6b}
.cal-ev.done{opacity:.45;text-decoration:line-through}
.cal-ev.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.cal-ev.cr{border-top-right-radius:0;border-bottom-right-radius:0}
/* inline edit / task color */
.edit-title{display:block;width:calc(100% + 4px);margin:-3px -2px;font:inherit;font-size:16px;line-height:1.4;color:var(--text);background:var(--bg);border:2px solid var(--accent);border-radius:6px;padding:2px 6px;resize:none;overflow:hidden;outline:none;user-select:text;-webkit-user-select:text}
.card-more{flex:none;border:0;background:none;color:var(--sub);font-size:18px;line-height:1;padding:0 4px;margin:-1px -4px 0 0;align-self:flex-start}
.sw-auto{height:34px;border-radius:17px;padding:0 12px;border:3px solid transparent;background:var(--bg);color:var(--text);font-size:13px;box-shadow:inset 0 0 0 2px var(--line)}
.sw-auto.on{border-color:var(--text)}
.card.tc{border-left:6px solid var(--tc);background:color-mix(in srgb,var(--tc) 11%,var(--panel))}
/* ===== todo view (ひとつずつ風) ===== */
[hidden]{display:none!important}
:root[data-view="todo"]{
  --bg:#EDF1F0;--panel:#FFFFFF;--text:#14262B;--sub:#4E6266;--line:#D2DDDC;--accent:#0B7A83;--col:#E2EAE9;
  --td-soft:#CFE8EA;--td-ink:#075E66;--td-warn:#B4400C;--td-warn-soft:#F7DFD2;--td-shadow:0 8px 28px rgba(20,38,43,.18);--td-on:#FFFFFF;--td-accent-fg:#FFFFFF;--td-line2:#9FB3B3;
  --c-teal:#0B7A83;--c-blue:#2F5FD0;--c-violet:#7A4FD1;--c-pink:#C63D86;--c-red:#CC3B33;--c-orange:#C46A0A;--c-green:#3C8A2E;--c-gray:#5F6F72;
  --td-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --td-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --td-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root[data-view="todo"]{
    --bg:#0C1719;--panel:#132226;--text:#E4EFEF;--sub:#93AAAD;--line:#26393D;--accent:#4CC2CB;--col:#1B2F34;
    --td-soft:#17383C;--td-ink:#8FDDE3;--td-warn:#F08D5A;--td-warn-soft:#3A2418;--td-shadow:0 8px 28px rgba(0,0,0,.55);--td-on:#0C1719;--td-accent-fg:#062226;--td-line2:#3D575C;
    --c-teal:#4CC2CB;--c-blue:#7FA2FF;--c-violet:#B396FF;--c-pink:#FF86C0;--c-red:#FF8279;--c-orange:#F5A649;--c-green:#8CD67B;--c-gray:#A3B4B7;
  }
}
:root[data-view="todo"] .btn.pri,:root[data-view="todo"] .fab{color:var(--td-accent-fg)}
:root[data-view="todo"] .sheet{font-family:var(--td-body)}
.todo{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 16px 110px;font-family:var(--td-body);font-size:15px;line-height:1.6;color:var(--text);-webkit-text-size-adjust:100%}
.td-wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.td-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.td-eyebrow{font-size:.75rem;color:var(--sub);letter-spacing:.08em}
.td-top h1{margin:0;font:700 1.75rem/1.3 var(--td-display)}
.td-sync{font-size:.6875rem;color:var(--sub);text-align:right}
.td-hint{margin:-8px 4px 0;font-size:.75rem;color:var(--sub)}
.td-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.td-stat{background:var(--panel);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.td-stat .k{font-size:.75rem;color:var(--sub);letter-spacing:.04em}
.td-stat .v{font:500 1.5rem/1 var(--td-mono);font-variant-numeric:tabular-nums}
.td-stat .v small{font-size:.875rem;color:var(--sub);font-family:var(--td-body)}
.td-bar{height:6px;border-radius:3px;background:var(--col);overflow:hidden}
.td-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.td-sec{display:flex;flex-direction:column;gap:8px}
.td-sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.td-sec-h h2{margin:0;font:700 1rem/1.4 var(--td-display)}
.td-sec-h .n{font:400 .75rem/1 var(--td-mono);color:var(--sub)}
.td-hr{display:flex;align-items:center;gap:6px}
.td-mini{font-size:.8125rem;font-weight:700;color:var(--td-ink);padding:6px 8px;border-radius:8px;border:0;background:none}
.td-group{list-style:none;margin:0;padding:0;background:var(--panel);border-radius:16px;overflow:hidden}
.td-group.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--td-soft)}
.td-row{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 8px 8px 12px}
.td-row.has-grip{padding-left:2px;gap:6px}
.td-row+.td-row{border-top:1px solid var(--line)}
.td-row.tint{background:color-mix(in srgb,var(--tc) 14%,var(--panel));min-height:54px}
.td-row.dragging{opacity:.35}
.td-row.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.td-row.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.td-ghost{position:fixed;z-index:150;margin:0;border-radius:14px;box-shadow:var(--td-shadow);pointer-events:none;background:var(--panel);opacity:.96;list-style:none;font-family:var(--td-body);color:var(--text)}
.td-ghost.tint{background:color-mix(in srgb,var(--tc) 22%,var(--panel))}
.td-t{flex:1;min-width:0;overflow-wrap:anywhere;text-align:left;padding:4px 0;border:0;background:none;color:inherit;font:inherit}
.td-t span{display:block}
.td-t small{display:block;font-size:.75rem;color:var(--sub);font-family:var(--td-mono);font-variant-numeric:tabular-nums}
.td-t small.memo{font-family:var(--td-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-row.is-done .td-t{color:var(--sub)}
.td-row.is-done .td-t span{text-decoration:line-through}
.td-grip{flex:none;width:34px;height:44px;display:grid;place-items:center;color:var(--sub);border:0;background:none;border-radius:10px;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

<body>
<script id="state" type="application/json">null</script>
<script id="app">
(function(){
'use strict';
var LS='taskboard-v1', LSUI='taskboard-ui-v1';
var COLORS=['#4A90E2','#4CB782','#E46FA8','#8B6FD6','#F2994A','#D9AE2B','#E5534B','#2BA8A0','#8792A2'];
var DELW=80, MAXL=5;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};

/* ---------- dates ---------- */
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
var diff=function(a,b){var A=parse(a),B=parse(b);return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate())-Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/864e5)};
var todayS=function(){return ymd(new Date())};
var dow=function(s){return parse(s).getDay()};
var WD='日月火水木金土';
var md=function(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
var holCache={};
function holidays(y){
  if(holCache[y])return holCache[y];
  var H={};
  var set=function(m,d,n){H[y+'-'+pad(m)+'-'+pad(d)]=n};
  var nthMon=function(m,n){var f=new Date(y,m-1,1).getDay();return 1+((8-f)%7)+(n-1)*7};
  var k=y-1980;
  set(1,1,'元日');set(1,nthMon(1,2),'成人の日');set(2,11,'建国記念の日');
  if(y>=2020)set(2,23,'天皇誕生日');
  set(3,Math.floor(20.8431+0.242194*k-Math.floor(k/4)),'春分の日');
  set(4,29,'昭和の日');set(5,3,'憲法記念日');set(5,4,'みどりの日');set(5,5,'こどもの日');
  set(7,nthMon(7,3),'海の日');set(8,11,'山の日');set(9,nthMon(9,3),'敬老の日');
  set(9,Math.floor(23.2488+0.242194*k-Math.floor(k/4)),'秋分の日');
  set(10,nthMon(10,2),'スポーツの日');set(11,3,'文化の日');set(11,23,'勤労感謝の日');
  Object.keys(H).sort().forEach(function(d){
    if(H[addDays(d,2)]){var mid=addDays(d,1);if(!H[mid]&&dow(mid)!==0)H[mid]='国民の休日';}
  });
  Object.keys(H).sort().forEach(function(d){
    if(dow(d)===0){var x=addDays(d,1);while(H[x])x=addDays(x,1);H[x]='振替休日';}
  });
  return holCache[y]=H;
}
var holName=function(s){return holidays(+s.slice(0,4))[s]};
function range(t){if(!t.start&&!t.end)return null;var s=t.start||t.end,e=t.end||t.start;return [s,e<s?s:e]}

/* ---------- state ---------- */
function defaultLists(){return [['共有事項',COLORS[0]],['ToDoリスト',COLORS[1]],['進行中',COLORS[2]],['完了',COLORS[3]]].map(function(a){return {id:uid(),name:a[0],color:a[1],tasks:[]}})}
function newBoard(name){return {id:uid(),name:name,lists:defaultLists()}}
function defaultState(){return {v:1,updatedAt:0,boards:[newBoard('ボード1')]}}
function valid(s){return s&&Array.isArray(s.boards)&&s.boards.length>0}
var embedded=null;try{embedded=JSON.parse($('#state').textContent)}catch(e){}
var local=null;try{local=JSON.parse(localStorage.getItem(LS))}catch(e){}
var state=[embedded,local].filter(valid).sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0)})[0]||defaultState();
var ui={view:'board',boardId:null,scope:'board',calMonth:todayS().slice(0,7),gMode:'day',collapsed:{}};
try{Object.assign(ui,JSON.parse(localStorage.getItem(LSUI))||{})}catch(e){}
if(['todo','board','gantt','cal','memo'].indexOf(ui.view)<0)ui.view='board';
function saveUI(){try{localStorage.setItem(LSUI,JSON.stringify(ui))}catch(e){}}
function board(){var b=state.boards.find(function(b){return b.id===ui.boardId});if(!b){b=state.boards[0];ui.boardId=b.id}return b}
function allMode(){return ui.view!=='board'&&ui.scope==='all'&&state.boards.length>1}
function scopeBoards(){return allMode()?state.boards:[board()]}
function findTask(id){for(var i=0;i<state.boards.length;i++){var b=state.boards[i];for(var j=0;j<b.lists.length;j++){var l=b.lists[j];for(var k=0;k<l.tasks.length;k++)if(l.tasks[k].id===id)return {b:b,l:l,t:l.tasks[k],i:k}}}return null}
function findList(id){for(var i=0;i<state.boards.length;i++){var b=state.boards[i];for(var j=0;j<b.lists.length;j++)if(b.lists[j].id===id)return {b:b,l:b.lists[j],i:j}}return null}

/* ---------- save / sync ---------- */
var api=null,readOnly=false,pubTimer=null,lastPub=(embedded&&embedded.updatedAt)||0;
function save(){state.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){toast('保存できませんでした（空き容量を確認してください）')}}
function busy(){return !!(cd&&cd.active)||!!(g&&g.mode)||!!gb||!!drag||!!$('.sheet-bg')||!!$('.add-input')||!!$('.toast.show')}
function schedulePub(ms){clearTimeout(pubTimer);pubTimer=setTimeout(function(){publish(false)},ms)}
function buildHTML(){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">\n<meta name="theme-color" content="#4A90E2">\n<title>タスクボード</title>\n<style id="css">'+$('#css').textContent+'</style>\n</head>\n<body>\n<script id="state" type="application/json">'+json+'<\/script>\n<script id="app">'+$('#app').textContent+'<\/script>\n</body>\n</html>\n';
}
function publish(force){
  if(!api||readOnly||state.updatedAt===lastPub)return;
  if(!force&&busy()){schedulePub(1500);return}
  var ver=state.updatedAt;
  try{
    Promise.resolve(api.publish(buildHTML())).then(function(){lastPub=ver},function(e){
      var c=String((e&&(e.code||e.name||e.message))||'');if(/not_granted|not_writer/.test(c))readOnly=true;
    });
  }catch(e){}
}
function initApi(n){
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(a){if(a){api=a;if(state.updatedAt!==lastPub)schedulePub(3000)}}).catch(function(){});
  }else if(n<30)setTimeout(function(){initApi(n+1)},300);
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')saveUI()});

/* ---------- shell ---------- */
var ICON={
  memo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/><path d="M9 2.5v3M15 2.5v3"/></svg>',
  todo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>',
  board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>',
  gantt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 6h7M8 12h11M6 18h7"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'
};
document.body.insertAdjacentHTML('beforeend','<div id="root"><header><div class="tabs" id="tabs"></div><button class="gear" id="gear" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></header><main id="main"></main><nav id="nav"></nav></div><div id="toast" class="toast"></div>');

function renderAll(){document.documentElement.setAttribute('data-view',ui.view);$('header').style.display=(ui.view==='todo'||ui.view==='memo')?'none':'';renderTabs();renderNav();renderMain();saveUI()}
function renderMain(){if(ui.view==='memo')renderMemo();else if(ui.view==='todo')renderTodo();else if(ui.view==='gantt')renderGantt();else if(ui.view==='cal')renderCal();else renderBoard()}
function renderNav(){
  $('#nav').innerHTML=[['todo','todo'],['board','ボード'],['gantt','ガントチャート'],['cal','カレンダー'],['memo','メモ']].map(function(a){
    return '<button data-view="'+a[0]+'" class="'+(ui.view===a[0]?'on':'')+'">'+ICON[a[0]]+a[1]+'</button>'}).join('');
}
function renderTabs(){
  var am=allMode(),cur=board(),h='';
  if(ui.view!=='board'&&state.boards.length>1)h+='<button class="tab nomenu '+(am?'on':'')+'" data-tab="all">すべて</button>';

  if(v===board().id&&!allMode()){boardMenu(v);return}

});

/* ---------- sheets & toast ---------- */
function openSheet(html){closeSheet();var bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML='<div class="sheet">'+html+'</div>';var t0=Date.now();bg.addEventListener('click',function(e){if(Date.now()-t0<450){e.stopPropagation();e.preventDefault()}},true);bg.addEventListener('click',function(e){if(e.target===bg)closeSheet()});document.body.appendChild(bg);return bg.firstChild}
function closeSheet(){$$('.sheet-bg').forEach(function(x){x.remove()})}
function promptSheet(title,val,cb,ok){
  var s=openSheet('<h3>'+esc(title)+'</h3><form><label class="fld"><input id="pIn" value="'+esc(val)+'" maxlength="40" enterkeyhint="done"></label><div class="btns"><button type="button" class="btn" data-x>キャンセル</button><button class="btn pri">'+(ok||'OK')+'</button></div></form>');
  $('[data-x]',s).onclick=closeSheet;

function renderBoard(){

function showInlineAdd(lid){
  var body=$('.col-body[data-list="'+lid+'"]');if(!body)return;
  var ex=$('.add-input',body);if(ex){ex.focus();return}
  var form=document.createElement('form');
  form.innerHTML='<input class="add-input" placeholder="タスク名を入力して決定" enterkeyhint="done" maxlength="300">';
  body.appendChild(form);body.scrollTop=body.scrollHeight;
  var inp=$('input',form);
  var add=function(){
    var v=inp.value.trim();if(!v)return false;var tl=findList(lid);if(!tl)return false;
    var t={id:uid(),title:v,done:false,start:'',end:''};tl.l.tasks.push(t);
    var tmp=document.createElement('div');tmp.innerHTML=cardHTML(t);var el=tmp.firstChild;form.before(el);body.scrollTop=body.scrollHeight;

    inp.value='';save();return true;

  inp.addEventListener('paste',function(e){

    e.preventDefault();
    var a=inp.selectionStart||0,b=inp.selectionEnd||0,all=inp.value.slice(0,a)+txt+inp.value.slice(b);
    var n=bulkAppend(lid,all,function(t){var tmp=document.createElement('div');tmp.innerHTML=cardHTML(t);form.before(tmp.firstChild)});

  });
  form.onsubmit=function(e){e.preventDefault();if(!add())inp.blur();else inp.focus()};
  inp.addEventListener('blur',function(){setTimeout(function(){if(!form.isConnected)return;add();form.remove();renderBoard()},120)});
  inp.focus();
}

/* bulk add: 1行 = 1タスク、リストの一番下に順番に追加 */
function bulkLines(text){return String(text||'').replace(/\r\n?/g,'\n').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){return l.slice(0,300)})}
function bulkAppend(lid,text,onEach){
  var tl=findList(lid);if(!tl)return 0;
  var lines=bulkLines(text);
  lines.forEach(function(v){var t={id:uid(),title:v,done:false,start:'',end:''};tl.l.tasks.push(t);if(onEach)onEach(t)});
  if(lines.length)save();
  return lines.length;
}

/* gestures: tap / swipe-to-delete / long-press drag */
var g=null,openSwipe=null,drag=null;
function closeSwipe(){if(!openSwipe)return;var w=openSwipe;openSwipe=null;var c=$('.card',w);if(c)c.style.transform='';setTimeout(function(){w.classList.remove('sw')},220)}
function bDown(e){
  if(e.button>0)return;
  var ed=document.activeElement;
  if(ed&&ed.classList&&ed.classList.contains('edit-title')){if(e.target!==ed)ed.blur();return}
  var card=e.target.closest('.card');
  if(openSwipe&&!e.target.closest('.card-del')){var was=openSwipe;closeSwipe();if(card&&card.parentElement===was)return}
  if(!card){var hd=e.target.closest('.col-head');if(hd&&!e.target.closest('.icon'))cDown(e,hd);return}
  if(e.target.closest('.chk,.card-more'))return;
  var wrap=card.parentElement;
  g={meta:!!e.target.closest('.meta'),id:wrap.dataset.task,wrap:wrap,card:card,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,mode:null,pid:e.pointerId,type:e.pointerType};
  if(e.pointerType!=='mouse')g.timer=setTimeout(function(){if(g&&!g.mode)startDrag()},380);
}
function bMove(e){
  if(!g||e.pointerId!==g.pid)return;
  g.x=e.clientX;g.y=e.clientY;var dx=g.x-g.x0,dy=g.y-g.y0;
  if(!g.mode){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    clearTimeout(g.timer);
    if(g.type==='mouse'){startDrag();return}
    if(Math.abs(dx)>Math.abs(dy)*1.2){
      if(dx<0){g.mode='swipe';g.wrap.classList.add('sw');g.card.style.transition='none'}
      else{g.mode='pan';g.sx=$('#board').scrollLeft}
    }else{g=null;return}
  }
  if(g.mode==='swipe'){g.tx=Math.max(-DELW-40,Math.min(0,dx));g.card.style.transform='translateX('+g.tx+'px)'}
  else if(g.mode==='pan'){$('#board').scrollLeft=g.sx-dx}
  else if(g.mode==='drag')dragMove();
}
function bUp(e,cancel){
  if(!g||e.pointerId!==g.pid)return;clearTimeout(g.timer);var G=g;g=null;
  if(!G.mode){if(!cancel){if(G.meta)openTaskSheet(G.id);else startInlineEdit(G.id)}return}
  if(G.mode==='swipe'){
    G.card.style.transition='';
    if((G.tx||0)<-DELW/2){G.card.style.transform='translateX('+(-DELW)+'px)';openSwipe=G.wrap}
    else{G.card.style.transform='';setTimeout(function(){G.wrap.classList.remove('sw')},220)}
  }else if(G.mode==='drag')dragEnd(cancel);
}
function startDrag(){
  var G=g;G.mode='drag';try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  var r=G.wrap.getBoundingClientRect();
  var gh=G.card.cloneNode(true);gh.classList.add('ghost');gh.style.width=r.width+'px';gh.style.left=r.left+'px';gh.style.top=r.top+'px';gh.style.transform='rotate(2deg)';
  document.body.appendChild(gh);
  var ph=document.createElement('div');ph.className='ph';ph.style.height=r.height+'px';
  G.wrap.after(ph);G.wrap.style.display='none';
  drag={G:G,gh:gh,ph:ph,ox:G.x-r.left,oy:G.y-r.top,raf:0};
  var loop=function(){if(!drag)return;autoScroll();drag.raf=requestAnimationFrame(loop)};drag.raf=requestAnimationFrame(loop);
  dragMove();
}
function dragMove(){
  var G=drag.G,ph=drag.ph;drag.gh.style.left=(G.x-drag.ox)+'px';drag.gh.style.top=(G.y-drag.oy)+'px';
  var el=document.elementFromPoint(G.x,G.y);var col=el&&el.closest('.col:not(.add-col)');if(!col)return;
  var body=$('.col-body',col);if(!body)return;
  var before=null,kids=body.children;
  for(var i=0;i<kids.length;i++){var c=kids[i];if(!c.classList.contains('card-wrap')||c===G.wrap)continue;var r=c.getBoundingClientRect();if(G.y<r.top+r.height/2){before=c;break}}
  if(before){if(ph.nextSibling!==before)body.insertBefore(ph,before)}
  else if(body.lastElementChild!==ph)body.appendChild(ph);
}
function autoScroll(){
  var G=drag.G,bd=$('#board');if(!bd)return;var r=bd.getBoundingClientRect(),moved=false;
  if(G.x<r.left+40){bd.scrollLeft-=10;moved=true}else if(G.x>r.right-40){bd.scrollLeft+=10;moved=true}
  var el=document.elementFromPoint(G.x,G.y),col=el&&el.closest('.col'),body=col&&$('.col-body',col);
  if(body){var br=body.getBoundingClientRect();if(G.y<br.top+30&&body.scrollTop>0){body.scrollTop-=8;moved=true}else if(G.y>br.bottom-30){body.scrollTop+=8;moved=true}}
  if(moved)dragMove();
}
function dragEnd(cancel){
  var D=drag;drag=null;cancelAnimationFrame(D.raf);D.gh.remove();
  if(!cancel){
    var body=D.ph.parentElement,lid=body&&body.dataset.list;
    if(lid){
      var idx=0,kids=body.children;
      for(var i=0;i<kids.length;i++){var c=kids[i];if(c===D.ph)break;if(c.classList.contains('card-wrap')&&c!==D.G.wrap)idx++}
      var f=findTask(D.G.id),tl=findList(lid);
      if(f&&tl){f.l.tasks.splice(f.i,1);tl.l.tasks.splice(idx,0,f.t);save()}
    }
  }
  renderBoard();
}

/* inline title edit on the board */
function startInlineEdit(id){
  var wrap=$('.card-wrap[data-task="'+id+'"]'),f=findTask(id);
  if(!wrap||!f||$('.edit-title',wrap))return;
  var old=$('.title',wrap);if(!old)return;
  var ta=document.createElement('textarea');
  ta.className='edit-title';ta.rows=1;ta.maxLength=300;ta.value=f.t.title;ta.setAttribute('enterkeyhint','done');
  old.replaceWith(ta);
  var fit=function(){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'};
  fit();ta.addEventListener('input',fit);
  var done=false;
  var finish=function(commit){
    if(done)return;done=true;
    var v=ta.value.trim(),cur=findTask(id);
    if(commit&&cur){
      if(!v)toast('題目は空にできません');
      else if(v!==cur.t.title){cur.t.title=v;save()}
    }
    renderMain();
  };
  ta.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();ta.blur()}
    else if(e.key==='Escape'){finish(false)}
  });
  ta.addEventListener('blur',function(){finish(true)});
  ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
}

/* list (column) long-press drag */
var cd=null;
function cDown(e,head){
  var col=head.closest('.col');if(!col||!col.dataset.list)return;
  cd={col:col,id:col.dataset.list,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,pid:e.pointerId,type:e.pointerType,active:false};
  if(e.pointerType!=='mouse')cd.timer=setTimeout(function(){if(cd&&!cd.active)cStart()},380);
}
function cStart(){
  var C=cd;C.active=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  var r=C.col.getBoundingClientRect();
  var gh=C.col.cloneNode(true);gh.classList.add('col-ghost');gh.style.width=r.width+'px';gh.style.height=r.height+'px';gh.style.left=r.left+'px';gh.style.top=r.top+'px';
  document.body.appendChild(gh);
  var ph=document.createElement('div');ph.className='col-ph';ph.style.width=r.width+'px';ph.style.minHeight=r.height+'px';
  C.col.after(ph);C.col.style.display='none';
  C.gh=gh;C.ph=ph;C.ox=C.x-r.left;C.oy=C.y-r.top;
  var loop=function(){if(!cd||!cd.active)return;cAuto();cd.raf=requestAnimationFrame(loop)};C.raf=requestAnimationFrame(loop);
  cPlace();
}
function cMove(e){
  if(!cd||e.pointerId!==cd.pid)return;
  cd.x=e.clientX;cd.y=e.clientY;
  if(!cd.active){
    if(Math.abs(cd.x-cd.x0)<8&&Math.abs(cd.y-cd.y0)<8)return;
    clearTimeout(cd.timer);
    if(cd.type==='mouse')cStart();else{cd=null;return}
    return;
  }
  cPlace();
}
function cPlace(){
  var C=cd;C.gh.style.left=(C.x-C.ox)+'px';C.gh.style.top=(C.y-C.oy)+'px';
  var bd=$('#board');if(!bd)return;
  var cols=$$('.col:not(.add-col)',bd).filter(function(c){return c!==C.col}),before=null;
  for(var i=0;i<cols.length;i++){var r=cols[i].getBoundingClientRect();if(C.x<r.left+r.width/2){before=cols[i];break}}
  if(before){if(C.ph.nextSibling!==before)bd.insertBefore(C.ph,before)}
  else{var ac=$('.add-col',bd);if(C.ph.nextSibling!==ac)bd.insertBefore(C.ph,ac)}
}
function cAuto(){
  var bd=$('#board');if(!bd)return;var r=bd.getBoundingClientRect();
  if(cd.x<r.left+50){bd.scrollLeft-=12;cPlace()}else if(cd.x>r.right-50){bd.scrollLeft+=12;cPlace()}
}
function cUp(e,cancel){
  if(!cd||e.pointerId!==cd.pid)return;clearTimeout(cd.timer);var C=cd;cd=null;
  if(!C.active)return;
  cancelAnimationFrame(C.raf);C.gh.remove();
  if(!cancel){
    var idx=0,kids=$('#board').children;
    for(var i=0;i<kids.length;i++){var k=kids[i];if(k===C.ph)break;if(k.classList.contains('col')&&!k.classList.contains('add-col')&&k!==C.col)idx++}
    var f=findList(C.id);
    if(f&&f.i!==idx){f.b.lists.splice(f.i,1);f.b.lists.splice(idx,0,f.l);save()}
  }
  renderBoard();
}

/* ---------- gantt view ---------- */
var gctx={start:todayS(),DW:34},ganttReset=false,gb=null;
function renderGantt(){
  var m=$('#main'),old=$('#gantt'),keep=(old&&!ganttReset)?{x:old.scrollLeft,y:old.scrollTop}:null;ganttReset=false;
  var DW=ui.gMode==='day'?34:12,LW=Math.max(110,Math.min(170,Math.round(window.innerWidth*0.32)));
  var td=todayS(),mn=td,mx=td,groups=[],am=allMode();
  scopeBoards().forEach(function(b){b.lists.forEach(function(l){groups.push({b:b,l:l});l.tasks.forEach(function(t){var r=range(t);if(r){if(r[0]<mn)mn=r[0];if(r[1]>mx)mx=r[1]}})})});
  var start=addDays(mn,-14);start=start.slice(0,8)+'01';start=addDays(start,-dow(start));
  var ed=parse(addDays(mx,45)),end=ymd(new Date(ed.getFullYear(),ed.getMonth()+1,0));end=addDays(end,6-dow(end));
  var n=diff(start,end)+1,W=n*DW;gctx={start:start,DW:DW};
  var scale='',stripes='';
  for(var i=0;i<n;i++){
    var d=addDays(start,i),w=dow(d),day=+d.slice(8),hol=holName(d);
    if(i===0||day===1)scale+='<div class="g-mon" style="left:'+i*DW+'px">'+d.slice(0,4)+'年'+(+d.slice(5,7))+'月</div>';
    if(ui.gMode==='day'){
      var cls=(w===0||hol)?'r':(w===6?'b':'');if(d===td)cls+=' t';
      scale+='<div class="g-day '+cls+'" style="left:'+i*DW+'px;width:'+DW+'px">'+day+'<br>'+WD[w]+'</div>';
    }else if(w===0){
      scale+='<div class="g-day" style="left:'+i*DW+'px;width:'+7*DW+'px">'+md(d)+'〜</div>';
    }
    if(w===0||w===6||hol)stripes+='<div class="g-stripe" style="left:'+i*DW+'px;width:'+DW+'px"></div>';
  }
  var rows='';
  groups.forEach(function(gp){
    var l=gp.l,col=ui.collapsed[l.id];
    var label=(am?esc(gp.b.name)+' / ':'')+esc(l.name);
    rows+='<div class="g-row grp" style="--c:'+l.color+'" data-grp="'+l.id+'"><div class="g-name"><span>'+label+' ('+l.tasks.length+')</span><i class="caret">'+(col?'▸':'▾')+'</i></div><div class="g-track" style="width:'+W+'px"></div></div>';
    if(col)return;
    l.tasks.forEach(function(t){
      var r=range(t);
      rows+='<div class="g-row'+(t.done?' done':'')+'" data-task="'+t.id+'"><div class="g-name" data-open="'+t.id+'"><span>'+esc(t.title)+'</span></div><div class="g-track" style="width:'+W+'px">'+
        (r?'<div class="g-bar'+(t.done?' done':'')+'" data-bar="'+t.id+'" style="--c:'+(t.color||l.color)+';left:'+(diff(start,r[0])*DW+1)+'px;width:'+((diff(r[0],r[1])+1)*DW-2)+'px"></div>':'')+
        '</div></div>';
    });
  });
  if(!groups.length)rows='<div class="empty">リストがありません</div>';
  m.innerHTML='<div class="g-wrap"><div class="g-tool"><div class="seg"><button data-gm="day" class="'+(ui.gMode==='day'?'on':'')+'">日ごと</button><button data-gm="week" class="'+(ui.gMode==='week'?'on':'')+'">週ごと</button></div><button class="small-btn" data-act="g-today">今日</button><span class="hint">長押しで移動・タップで色変更<br>日付なしは行をタップで設定</span></div>'+
    '<div class="gantt" id="gantt" style="--dw:'+DW+'px;--lw:'+LW+'px"><div class="g-inner" style="width:'+(LW+W)+'px">'+
    '<div class="g-head"><div class="g-corner">タスク</div><div class="g-scale" style="width:'+W+'px">'+scale+'</div></div>'+
    '<div class="g-body"><div class="g-stripes" style="left:'+LW+'px;width:'+W+'px;background-size:'+(ui.gMode==='day'?DW:DW*7)+'px 100%;background-position:0 0">'+stripes+'<div class="g-today" style="left:'+((diff(start,td)+0.5)*DW-1)+'px"></div></div>'+rows+'<div class="g-row fill"><div class="g-name"></div></div></div>'+
    '</div></div><button class="fab" data-act="fab" aria-label="タスクを追加">＋</button></div>';
  var gt=$('#gantt');
  if(keep){gt.scrollLeft=keep.x;gt.scrollTop=keep.y}else scrollGanttToday(false);
}
function scrollGanttToday(smooth){var gt=$('#gantt');if(!gt)return;var x=Math.max(0,(diff(gctx.start,todayS())-2)*gctx.DW);if(smooth&&gt.scrollTo)gt.scrollTo({left:x,behavior:'smooth'});else gt.scrollLeft=x}
function gDown(e){
  if(e.button>0)return;var bar=e.target.closest('.g-bar');if(!bar)return;
  gb={id:bar.dataset.bar,bar:bar,x0:e.clientX,y0:e.clientY,pid:e.pointerId,type:e.pointerType,active:false,left:parseFloat(bar.style.left),shift:0};
  if(e.pointerType!=='mouse')gb.timer=setTimeout(function(){if(gb&&!gb.active){gb.active=true;bar.classList.add('drag');try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}},350);
}
function gMove(e){
  if(!gb||e.pointerId!==gb.pid)return;var dx=e.clientX-gb.x0,dy=e.clientY-gb.y0;
  if(!gb.active){
    if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
    clearTimeout(gb.timer);
    if(gb.type==='mouse'){gb.active=true;gb.bar.classList.add('drag')}else{gb=null;return}
  }
  gb.shift=Math.round(dx/gctx.DW);gb.bar.style.left=(gb.left+gb.shift*gctx.DW)+'px';
}
function gUp(e,cancel){
  if(!gb||e.pointerId!==gb.pid)return;clearTimeout(gb.timer);var G=gb;gb=null;
  if(!G.active){if(!cancel)openTaskSheet(G.id);return}
  G.bar.classList.remove('drag');
  if(G.shift&&!cancel){var f=findTask(G.id),r=f&&range(f.t);if(r){f.t.start=addDays(r[0],G.shift);f.t.end=addDays(r[1],G.shift);save();toast(dateLabel(f.t)+' に移動しました')}}
  renderGantt();
}

/* ---------- calendar view ---------- */
var cs=null;
function renderCal(){
  var p=ui.calMonth.split('-').map(Number),y=p[0],mo=p[1];
  var first=y+'-'+pad(mo)+'-01',ws=addDays(first,-dow(first)),last=ymd(new Date(y,mo,0)),td=todayS();
  var items=[];
  scopeBoards().forEach(function(b){b.lists.forEach(function(l){l.tasks.forEach(function(t){var r=range(t);if(r)items.push({t:t,l:l,s:r[0],e:r[1]})})})});
  var weeks='';
  while(ws<=last){
    var we=addDays(ws,6),segs=[],i;
    for(i=0;i<7;i++){var hd=addDays(ws,i),hn=holName(hd);if(hn)segs.push({hol:hn,col:i,span:1})}
    items.forEach(function(it){if(it.e<ws||it.s>we)return;var s=it.s<ws?ws:it.s,e=it.e>we?we:it.e;segs.push({it:it,col:diff(ws,s),span:diff(s,e)+1,cl:it.s<ws,cr:it.e>we})});
    segs.sort(function(a,b){return (a.hol?0:1)-(b.hol?0:1)||a.col-b.col||b.span-a.span});
    var occ=[],more=[0,0,0,0,0,0,0];
    segs.forEach(function(sg){
      var L=0;
      for(;;L++){occ[L]=occ[L]||[];var ok=true;for(var c=sg.col;c<sg.col+sg.span;c++)if(occ[L][c]){ok=false;break}if(ok)break}
      for(var c2=sg.col;c2<sg.col+sg.span;c2++)occ[L][c2]=true;sg.lane=L;
      if(L>=MAXL)for(var c3=sg.col;c3<sg.col+sg.span;c3++)more[c3]++;
    });
    var anyMore=more.some(function(x){return x>0});
    var hgt=26+Math.max(3,Math.min(occ.length,MAXL))*20+(anyMore?14:2);
    var cells='';
    for(i=0;i<7;i++){
      var d=addDays(ws,i),cls='cal-cell';if(d.slice(0,7)!==ui.calMonth)cls+=' out';if(i===0||i===6)cls+=' we';if(d===td)cls+=' today';
      var nc=(i===0||holName(d))?'r':(i===6?'b':'');
      cells+='<div class="'+cls+'" data-day="'+d+'"><span class="cal-num '+nc+'">'+(+d.slice(8))+'</span>'+(more[i]?'<span class="cal-more">他'+more[i]+'件</span>':'')+'</div>';
    }
    var evs='';
    segs.forEach(function(sg){
      if(sg.lane>=MAXL)return;
      var st='left:calc('+sg.col+' * 100% / 7);width:calc('+sg.span+' * 100% / 7 - 2px);top:'+(26+sg.lane*20)+'px';
      if(sg.hol)evs+='<div class="cal-ev hol" style="'+st+'">'+esc(sg.hol)+'</div>';
      else evs+='<div class="cal-ev'+(sg.it.t.done?' done':'')+(sg.cl?' cl':'')+(sg.cr?' cr':'')+'" data-ev="'+sg.it.t.id+'" style="--c:'+(sg.it.t.color||sg.it.l.color)+';'+st+'">'+esc(sg.it.t.title)+'</div>';
    });
    weeks+='<div class="cal-week" style="height:'+hgt+'px"><div class="cal-cells">'+cells+'</div>'+evs+'</div>';
    ws=addDays(ws,7);
  }
  $('#main').innerHTML='<div class="cal"><div class="cal-top"><button class="nav-b" data-cal="-1" aria-label="前の月">‹</button><b>'+y+'年'+mo+'月</b><button class="nav-b" data-cal="1" aria-label="次の月">›</button><button class="small-btn" data-cal="0" style="margin-left:auto">今日</button></div>'+
    '<div class="cal-dow">'+WD.split('').map(function(w,i){return '<span style="'+(i===0?'color:var(--sun)':i===6?'color:var(--sat)':'')+'">'+w+'</span>'}).join('')+'</div>'+
    '<div class="cal-body" id="calBody">'+weeks+'</div><button class="fab" data-act="fab" aria-label="タスクを追加">＋</button></div>';
}
function shiftMonth(n){
  if(n===0){ui.calMonth=todayS().slice(0,7)}
  else{var p=ui.calMonth.split('-').map(Number);ui.calMonth=ymd(new Date(p[0],p[1]-1+n,1)).slice(0,7)}
  saveUI();renderCal();
}
function daySheet(d){
  var items=[];
  scopeBoards().forEach(function(b){b.lists.forEach(function(l){l.tasks.forEach(function(t){var r=range(t);if(r&&r[0]<=d&&d<=r[1])items.push({t:t,l:l})})})});
  var dt=parse(d),hn=holName(d);
  var s=openSheet('<h3>'+(dt.getMonth()+1)+'月'+dt.getDate()+'日（'+WD[dt.getDay()]+'）'+(hn?' <small style="color:var(--sun);font-weight:600">'+esc(hn)+'</small>':'')+'</h3>'+
    '<div>'+(items.length?items.map(function(x){return '<div class="day-item'+(x.t.done?' done':'')+'" data-id="'+x.t.id+'"><button class="chk" data-tg="'+x.t.id+'" aria-label="完了"></button><span class="dot" style="background:'+(x.t.color||x.l.color)+'"></span><span class="dt">'+esc(x.t.title)+'</span></div>'}).join(''):'<p class="empty">この日のタスクはありません</p>')+'</div>'+
    '<div class="btns"><button class="btn" data-m="close">閉じる</button><button class="btn pri" data-m="add">＋ この日に追加</button></div>');
  s.onclick=function(e){
    var tg=e.target.closest('[data-tg]');
    if(tg){var f=findTask(tg.dataset.tg);if(f){f.t.done=!f.t.done;tg.parentElement.classList.toggle('done',f.t.done);save();renderCal()}return}
    var it=e.target.closest('.day-item');if(it){openTaskSheet(it.dataset.id);return}
    var m=e.target.closest('[data-m]');if(!m)return;
    if(m.dataset.m==='close')closeSheet();else openTaskSheet(null,{start:d,end:d});
  };
}

var main=$('#main');
main.addEventListener('click',function(e){
  var t=e.target,a;
  if((a=t.closest('[data-act]'))){
    var id=a.dataset.id;
    switch(a.dataset.act){
      case 'toggle':toggleTask(id);break;
      case 'del-task':deleteTask(id);break;
      case 'list-menu':listMenu(id);break;
      case 'task-detail':openTaskSheet(id);break;

      case 'add-bulk':bulkAddSheet(id);break;

      case 'g-today':scrollGanttToday(true);break;

    }
    return;
  }
  if((a=t.closest('[data-gm]'))){if(ui.gMode!==a.dataset.gm){ui.gMode=a.dataset.gm;ganttReset=true;saveUI();renderGantt()}return}
  if((a=t.closest('[data-grp]'))){var gid=a.dataset.grp;if(ui.collapsed[gid])delete ui.collapsed[gid];else ui.collapsed[gid]=1;saveUI();renderGantt();return}
  if((a=t.closest('[data-open]'))){openTaskSheet(a.dataset.open);return}
  if(t.classList.contains('g-track')){
    var row=t.closest('[data-task]');
    if(row&&!$('.g-bar',t)){var r=t.getBoundingClientRect(),i=Math.floor((e.clientX-r.left)/gctx.DW),d=addDays(gctx.start,i),f=findTask(row.dataset.task);
      if(f){f.t.start=d;f.t.end=d;save();renderGantt();toast(md(d)+' に設定しました')}}

  if((a=t.closest('[data-cal]'))){shiftMonth(+a.dataset.cal);return}
  if((a=t.closest('[data-ev]'))){openTaskSheet(a.dataset.ev);return}
  if((a=t.closest('[data-day]'))){if(cs&&cs.swiped){cs=null;return}daySheet(a.dataset.day);return}

window.addEventListener('pointermove',function(e){bMove(e);gMove(e);cMove(e)});

var TCOL=[['teal','ティール'],['blue','ブルー'],['violet','パープル'],['pink','ピンク'],['red','レッド'],['orange','オレンジ'],['green','グリーン'],['gray','グレー']];
var TZONES=[['today','今日のタスク'],['week','一週間のタスク'],['list','タスク一覧']];
var TORDER=[1,2,3,4,5,6,0];
var TCHECK='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var TCHECK_S='<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var TGRIP='<button type="button" class="td-grip" aria-label="ドラッグして移動"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="5.5" r="1.8"/><circle cx="15" cy="5.5" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18.5" r="1.8"/><circle cx="15" cy="18.5" r="1.8"/></svg></button>';
var tdShowDone=false,tdd=null;
var isDate=function(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)};
function td(){
  var T=state.todo;
  if(!T||typeof T!=='object')T=state.todo={v:1,habits:[],tasks:[],log:{}};
  if(!Array.isArray(T.habits))T.habits=[];
  if(!Array.isArray(T.tasks))T.tasks=[];
  if(!T.log||typeof T.log!=='object')T.log={};
  if(!Array.isArray(T.tags))T.tags=[];
  return T;
}
function tdFindTask(id){var a=td().tasks;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function tdFindHabit(id){var a=td().habits;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function tdIdx(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return i;return -1}
function tdColor(t){for(var i=0;i<TCOL.length;i++)if(TCOL[i][0]===t.color)return t.color;return 'teal'}
function tdZoneFromDue(due){var t=todayS();if(!due)return 'list';if(due<=t)return 'today';if(due<=addDays(t,7))return 'week';return 'list'}
function tdZone(t){return (t.zone==='today'||t.zone==='week'||t.zone==='list')?t.zone:tdZoneFromDue(t.due)}
function tdHDone(id,date){var a=td().log[date];return !!a&&a.indexOf(id)>-1}
function tdTarget(h,date){if(!h.days||!h.days.length||h.days.length>=7)return true;return h.days.indexOf(parse(date).getDay())>-1}
function tdStreak(h){
  var today=todayS(),d=today,n=0,guard=0;
  while(guard<3700){
    guard++;
    if(tdTarget(h,d)){if(tdHDone(h.id,d))n++;else if(d!==today)break}
    else if(tdHDone(h.id,d)){n++}
    d=addDays(d,-1);
  }
  return n;
}
function tdChip(t,zone){
  if(t.done||!t.due)return '';
  var n=diff(todayS(),t.due);
  if(n<0)return '<span class="td-chip late">期限切れ</span>';
  if(zone==='week')return '<span class="td-chip'+(n===0?' today':'')+'">'+md(t.due)+'（'+WD[dow(t.due)]+'）</span>';
  if(n===0)return '<span class="td-chip today">今日</span>';
  if(n===1)return '<span class="td-chip">明日</span>';
  return '<span class="td-chip">'+md(t.due)+'</span>';
}
function tdRowHabit(h,today){
  var on=tdHDone(h.id,today),s=tdStreak(h);
  return '<li class="td-row has-grip'+(on?' is-done':'')+'" data-item="'+esc(h.id)+'" data-kind="habit">'+TGRIP+
    '<button class="td-check" data-act="td-th" data-id="'+esc(h.id)+'" aria-pressed="'+on+'" aria-label="'+esc(h.name)+'">'+TCHECK+'</button>'+
    '<button class="td-t" data-act="td-edith" data-id="'+esc(h.id)+'" aria-label="'+esc(h.name)+'を編集"><span>'+esc(h.name)+'</span><small>'+(s>0?'連続 '+s+'日':'今日から始めよう')+'</small></button></li>';
}
function tdRowTask(t,zone){
  var c=tdColor(t),grip=zone!=='done';
  var memo=t.memo?'<small class="memo">'+esc(String(t.memo).split(/\r?\n/)[0])+'</small>':'';
  return '<li class="td-row tint'+(grip?' has-grip':'')+(t.done?' is-done':'')+'" data-item="'+esc(t.id)+'" data-kind="task" style="--tc:var(--c-'+c+')">'+(grip?TGRIP:'')+
    '<button class="td-check sq" data-act="td-tt" data-id="'+esc(t.id)+'" aria-pressed="'+!!t.done+'" aria-label="'+esc(t.text)+'を完了にする">'+TCHECK+'</button>'+
    '<button class="td-t" data-act="td-edit" data-id="'+esc(t.id)+'" aria-label="'+esc(t.text)+'を編集"><span>'+esc(t.text)+'</span>'+memo+'</button>'+tdChip(t,zone)+'</li>';
}
function tdProgress(label,d,total){
  var pct=total?Math.round(d/total*100):0;
  var v=total?d+'<small> / '+total+'</small>':'<small>まだありません</small>';
  return '<div class="td-stat"><span class="k">'+label+'</span><span class="v">'+v+'</span><div class="td-bar"><i style="width:'+pct+'%"></i></div></div>';
}
function tdSection(title,count,addZone,zone,rows,emptyText,extra,after){
  return '<section class="td-sec"><div class="td-sec-h"><h2>'+title+'</h2><div class="td-hr"><span class="n">'+count+'</span><button class="td-mini" data-act="td-addto" data-zone="'+zone+'">＋ 追加</button>'+(extra||'')+'</div></div>'+
    '<ul class="td-group" data-drop="task" data-zone="'+zone+'">'+(rows||'<li class="td-drop-empty">'+emptyText+'</li>')+'</ul>'+(after||'')+'</section>';
}
function renderTodo(){
  var T=td(),today=todayS(),d=parse(today),m=$('#main');
  var old=$('#todo'),sy=old?old.scrollTop:0;
  var hs=T.habits.filter(function(h){return tdTarget(h,today)||tdHDone(h.id,today)});
  var hDone=hs.filter(function(h){return tdHDone(h.id,today)}).length;
  var open=T.tasks.filter(function(t){return !t.done});
  var dn=T.tasks.filter(function(t){return t.done});
  var inZone=function(z){return open.filter(function(t){return tdZone(t)===z})};
  var tl=inZone('today'),wl=inZone('week'),ll=inZone('list');
  var doneToday=dn.filter(function(t){return t.doneAt===today}).length;
  dn=dn.slice().sort(function(a,b){return (b.doneAt||'').localeCompare(a.doneAt||'')});
  var h='<div class="todo" id="todo"><div class="td-wrap">';
  h+='<div class="td-top"><div><div class="td-eyebrow">今日</div><h1>'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）</h1></div><div class="td-sync">この端末に保存</div></div>';
  h+='<p class="td-hint">左のつまみをドラッグすると、並べ替えや欄の移動ができます。</p>';
  h+='<div class="td-stats">'+tdProgress('習慣',hDone,hs.length)+tdProgress('タスク',doneToday,tl.length+doneToday)+'</div>';
  h+='<section class="td-sec"><div class="td-sec-h"><h2>習慣</h2><span class="n">'+hDone+'/'+hs.length+'</span></div>';
  h+=hs.length?'<ul class="td-group" data-drop="habit" data-zone="habits">'+hs.map(function(x){return tdRowHabit(x,today)}).join('')+'</ul>':'<div class="td-group td-empty">'+(T.habits.length?'今日の習慣はありません。':'毎日続けたいことを、＋から習慣として追加できます。')+'</div>';
  h+='</section>';
  h+=tdSection('今日のタスク','残り '+tl.length,'today','today',tl.map(function(t){return tdRowTask(t,'today')}).join(''),doneToday?'今日のタスクはすべて完了しました。':'今日のタスクはありません。ここへドラッグできます');
  h+=tdSection('一週間のタスク',wl.length+'件','week','week',wl.map(function(t){return tdRowTask(t,'week')}).join(''),'一週間のタスクがここに並びます。ここへドラッグできます');
  h+=tdSection('タスク一覧',ll.length+'件','list','list',ll.map(function(t){return tdRowTask(t,'list')}).join(''),'タスクがここに並びます。ここへドラッグできます','<button class="td-mini" data-act="td-tagadd">＋ タグ</button>',T.tags.length?'<div class="td-tags" data-drop="tag" data-zone="tags">'+T.tags.map(tdRenderTag).join('')+'</div>':'');
  if(dn.length){
    h+='<div><button class="td-link" data-act="td-sd">完了済み '+dn.length+'件を'+(tdShowDone?'隠す':'見る')+'</button>';
    if(tdShowDone)h+='<ul class="td-group">'+dn.slice(0,20).map(function(t){return tdRowTask(t,'done')}).join('')+'</ul>';
    h+='</div>';
  }
  h+='<details class="td-data"><summary>データの引き継ぎ・バックアップ</summary><div class="td-datab">'+
    '<p>別の端末やアプリ（「ひとつずつ」など）からデータを移すときに使います。移す元で「コピー」を押し、こちらの欄に貼り付けて「読み込む」を押してください。</p>'+
    '<button type="button" class="btn" data-act="td-export">データをコピー</button>'+
    '<textarea id="tdImportText" rows="3" placeholder="コピーしたデータをここに貼り付け" aria-label="読み込むデータ"></textarea>'+
    '<button type="button" class="btn pri" data-act="td-import">読み込む（このtodoのデータを置き換え）</button>'+
    '<div class="td-msg" id="tdMsg" role="status"></div></div></details>';
  h+='</div></div><button class="fab" data-act="td-add" aria-label="追加する">＋</button>';
  m.innerHTML=h;
  $('#todo').scrollTop=sy;
}

/* tags (タグごとの箇条書き) */
var CHEV='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function tdFindTag(id){var a=td().tags;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function tdParseBullets(text,old){
  var used={},out=[];
  String(text).replace(/\r/g,'').split('\n').forEach(function(line){
    var u=0,i=0,ch;
    for(;i<line.length;i++){ch=line.charAt(i);if(ch===' ')u+=1;else if(ch==='\t'||ch==='　')u+=2;else break}
    var body=line.slice(i).replace(/^(?:[・•]|[-*]\s)\s*/,'').replace(/\s+$/,'');
    if(!body){if(out.length&&out[out.length-1].t)out.push({t:'',l:0,d:false});return}
    var d=false;
    if(old)for(var k=0;k<old.length;k++){if(!used[k]&&old[k].t===body){used[k]=1;d=!!old[k].d;break}}
    out.push({t:body.slice(0,300),l:u===0?0:Math.min(3,Math.ceil(u/2)),d:d});
  });
  while(out.length&&!out[out.length-1].t)out.pop();
  return out.slice(0,500);
}
function tdBulletsText(items){return (items||[]).map(function(it){return it.t?'  '.repeat(it.l||0)+it.t:''}).join('\n')}
function tdNormTags(arr){
  var r=[];
  (Array.isArray(arr)?arr:[]).forEach(function(g){
    if(!g||typeof g.name!=='string')return;
    var items=[];
    (Array.isArray(g.items)?g.items:[]).forEach(function(it){
      if(!it||typeof it.t!=='string')return;
      items.push({t:it.t.slice(0,300),l:Math.max(0,Math.min(3,+it.l||0)),d:!!it.d});
    });
    r.push({id:String(g.id||uid()),name:g.name.slice(0,40),color:tdColor(g),collapsed:!!g.collapsed,items:items});
  });
  return r;
}
function tdRenderTag(g){
  var c=tdColor(g),n=g.items.filter(function(i){return i.t}).length,body='';
  if(!g.collapsed){
    body='<div class="td-bls">'+(g.items.length?g.items.map(function(it,i){
      return it.t?'<button class="td-bl lv'+it.l+(it.d?' is-done':'')+'" data-act="td-bl" data-id="'+esc(g.id)+'" data-i="'+i+'"><span class="m">・</span><span class="x">'+esc(it.t)+'</span></button>':'<div class="td-gap"></div>';
    }).join(''):'<div class="td-bl-empty">まだ何も書かれていません。</div>')+'</div>'+
    '<button class="td-mini td-bladd" data-act="td-bladd" data-id="'+esc(g.id)+'">＋ 行を追加</button>';
  }
  return '<div class="td-tag'+(g.collapsed?' folded':'')+'" data-item="'+esc(g.id)+'" data-kind="tag" style="--tc:var(--c-'+c+')"><div class="td-tag-h">'+TGRIP+
    '<button class="td-tag-t" data-act="td-tagedit" data-id="'+esc(g.id)+'" aria-label="'+esc(g.name)+'を編集">'+esc(g.name)+'</button><span class="n">'+n+'</span>'+
    '<button class="td-fold" data-act="td-fold" data-id="'+esc(g.id)+'" aria-label="開閉" aria-expanded="'+!g.collapsed+'">'+CHEV+'</button></div>'+body+'</div>';
}
function tdMoveTag(id,targetId,after){
  var T=td(),i=tdIdx(T.tags,id);if(i<0)return;
  var g=T.tags.splice(i,1)[0],j=targetId?tdIdx(T.tags,targetId):-1;
  if(j<0)T.tags.push(g);else T.tags.splice(after?j+1:j,0,g);
  save();renderTodo();
}
function tdIndentLines(ta,dir){
  var v=ta.value,a=ta.selectionStart,b=ta.selectionEnd;
  var ls=v.lastIndexOf('\n',a-1)+1,le=v.indexOf('\n',b);if(le<0)le=v.length;
  var lines=v.slice(ls,le).split('\n').map(function(l){
    if(dir>0)return '  '+l;
    return l.replace(/^(?:　| {1,2}|\t)/,'');
  });
  var nv=lines.join('\n');
  ta.value=v.slice(0,ls)+nv+v.slice(le);
  ta.setSelectionRange(ls,ls+nv.length);ta.focus();
}
var TBULLET_HELP='<p class="td-note">1行が1つの箇条書きになります。「・」は付けなくて大丈夫です。行頭に空白を入れる（または下の「段下げ」）と、一段下がります。空の行はすき間になります。</p>'+
  '<div class="td-chips"><button type="button" class="td-pick" data-ind="1">→ 段下げ</button><button type="button" class="td-pick" data-ind="-1">← 段上げ</button></div>';
function tdTagSheet(mode,id){
  var T=td(),g=mode==='edit'?tdFindTag(id):null;
  if(mode==='edit'&&!g)return;
  var color=g?tdColor(g):TCOL[T.tags.length%TCOL.length][0],edit=!!g;
  var s=openSheet('<form autocomplete="off"><h3>'+(edit?'タグの編集':'タグを追加')+'</h3>'+
    '<label class="fld">タグ名<input id="tgName" maxlength="40" enterkeyhint="next" placeholder="例: 今週すること" value="'+esc(g?g.name:'')+'"></label>'+
    '<span class="td-lab">色</span><div class="td-swatches">'+TCOL.map(function(c){return '<button type="button" class="td-sw" data-c="'+c[0]+'" style="--tc:var(--c-'+c[0]+')" aria-label="'+c[1]+'">'+TCHECK_S+'</button>'}).join('')+'</div>'+
    '<label class="fld">箇条書き<textarea id="tgText" class="td-big" rows="9" placeholder="1行に1つずつ書きます">'+esc(g?tdBulletsText(g.items):'')+'</textarea></label>'+TBULLET_HELP+
    '<div class="btns">'+(edit?'<button type="button" class="btn dan" id="tgDel">削除</button>':'')+'<button type="button" class="btn" id="tgCancel">キャンセル</button><button class="btn pri">'+(edit?'保存':'追加')+'</button></div></form>');
  var q=function(x){return $(x,s)},sync=function(){$$('.td-sw',s).forEach(function(b){b.classList.toggle('on',b.dataset.c===color)})};
  s.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.c){color=b.dataset.c;sync()}
    else if(b.dataset.ind){tdIndentLines(q('#tgText'),+b.dataset.ind)}
    else if(b.id==='tgCancel')closeSheet();
    else if(b.id==='tgDel'){closeSheet();var u=snapshot(),i=tdIdx(T.tags,g.id);if(i>-1)T.tags.splice(i,1);save();renderTodo();toast('タグを削除しました',u)}
  });
  q('form').onsubmit=function(e){
    e.preventDefault();
    var nm=q('#tgName').value.replace(/\s+/g,' ').trim();
    if(!nm){q('#tgName').focus();return}
    var items=tdParseBullets(q('#tgText').value,g?g.items:null);
    if(edit){g.name=nm;g.color=color;g.items=items}
    else T.tags.push({id:uid(),name:nm,color:color,collapsed:false,items:items});
    closeSheet();save();renderTodo();
  };
  sync();
  if(!edit)setTimeout(function(){q('#tgName').focus()},60);
}
function tdBulletAddSheet(id){
  var g=tdFindTag(id);if(!g)return;
  var s=openSheet('<form autocomplete="off"><h3>「'+esc(g.name)+'」に行を追加</h3>'+
    '<label class="fld">箇条書き<textarea id="tgText" class="td-big" rows="7" placeholder="1行に1つずつ書きます"></textarea></label>'+TBULLET_HELP+
    '<div class="btns"><button type="button" class="btn" id="tgCancel">キャンセル</button><button class="btn pri">追加</button></div></form>');
  s.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.ind)tdIndentLines($('#tgText',s),+b.dataset.ind);
    else if(b.id==='tgCancel')closeSheet();
  });
  $('form',s).onsubmit=function(e){
    e.preventDefault();
    var add=tdParseBullets($('#tgText',s).value,null);
    if(!add.length){$('#tgText',s).focus();return}
    g.items=g.items.concat(add).slice(0,500);
    closeSheet();save();renderTodo();
  };
  setTimeout(function(){$('#tgText',s).focus()},60);
}

/* actions */
function tdToggleHabit(id){
  var today=todayS(),T=td(),a=T.log[today]||[],i=a.indexOf(id);
  if(i>-1)a.splice(i,1);else a.push(id);
  if(a.length)T.log[today]=a;else delete T.log[today];
  save();renderTodo();
}
function tdToggleTask(id){
  var t=tdFindTask(id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?todayS():null;
  save();renderTodo();
}
function tdDeleteTask(id){
  var T=td(),i=tdIdx(T.tasks,id);if(i<0)return;
  var undo=snapshot();T.tasks.splice(i,1);save();renderTodo();toast('タスクを削除しました',undo);
}
function tdDeleteHabit(id){
  var T=td(),i=tdIdx(T.habits,id);if(i<0)return;
  var undo=snapshot();T.habits.splice(i,1);
  Object.keys(T.log).forEach(function(d){T.log[d]=T.log[d].filter(function(x){return x!==id});if(!T.log[d].length)delete T.log[d]});
  save();renderTodo();toast('習慣を削除しました',undo);
}
/* 欄の移動は期限を変えない（期限と欄は別々に設定できる） */
function tdMoveTask(id,to,targetId,after){
  var T=td(),i=tdIdx(T.tasks,id);if(i<0)return;
  var t=T.tasks.splice(i,1)[0];t.zone=to;
  var j=targetId?tdIdx(T.tasks,targetId):-1;
  if(j<0)T.tasks.push(t);else T.tasks.splice(after?j+1:j,0,t);
  save();renderTodo();
}
function tdMoveHabit(id,targetId,after){
  var T=td(),i=tdIdx(T.habits,id);if(i<0)return;
  var h=T.habits.splice(i,1)[0];
  var j=targetId?tdIdx(T.habits,targetId):-1;
  if(j<0)T.habits.push(h);else T.habits.splice(after?j+1:j,0,h);
  save();renderTodo();
}
function tdSetMsg(t){var e=$('#tdMsg');if(e)e.textContent=t}
function tdNormalize(o){
  var r={v:1,habits:[],tasks:[],log:{},tags:Array.isArray(o.tags)?tdNormTags(o.tags):td().tags},ids={};
  (o.habits||[]).forEach(function(h){
    if(!h||typeof h.name!=='string')return;
    var x={id:String(h.id||uid()),name:h.name.slice(0,300),created:isDate(h.created)?h.created:todayS()};
    if(Array.isArray(h.days)&&h.days.length&&h.days.length<7)x.days=h.days.filter(function(n){return n>=0&&n<=6});
    ids[x.id]=1;r.habits.push(x);
  });
  (o.tasks||[]).forEach(function(t){
    if(!t||typeof t.text!=='string')return;
    var due=isDate(t.due)?t.due:null;
    var x={id:String(t.id||uid()),text:t.text.slice(0,300),memo:typeof t.memo==='string'?t.memo:'',due:due,done:!!t.done,color:tdColor(t),
      zone:(t.zone==='today'||t.zone==='week'||t.zone==='list')?t.zone:tdZoneFromDue(due)};
    if(x.done)x.doneAt=isDate(t.doneAt)?t.doneAt:todayS();
    r.tasks.push(x);
  });
  if(o.log&&typeof o.log==='object')Object.keys(o.log).forEach(function(d){
    if(!isDate(d)||!Array.isArray(o.log[d]))return;
    var a=o.log[d].filter(function(id){return ids[id]});
    if(a.length)r.log[d]=a;
  });
  return r;
}
function tdExport(){
  var text=JSON.stringify(td()),ta=$('#tdImportText');
  var fb=function(){if(ta){ta.value=text;ta.focus();ta.select();try{ta.setSelectionRange(0,text.length)}catch(e){}}tdSetMsg('自動でコピーできませんでした。下の枠のテキストを長押しして、すべてコピーしてください。')};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){tdSetMsg('コピーしました。移す先の「貼り付け」欄に貼り付けてください。')},fb);
    else fb();
  }catch(e){fb()}
}
function tdImport(){
  var ta=$('#tdImportText'),o=null;
  try{o=JSON.parse(ta.value.trim())}catch(e){}
  if(o&&!Array.isArray(o.habits)&&o.todo)o=o.todo;
  if(!o||!Array.isArray(o.habits)||!Array.isArray(o.tasks)){tdSetMsg('データを読み取れませんでした。コピーしたデータ全体を貼り付けてください。');return}
  var undo=snapshot();state.todo=tdNormalize(o);save();renderTodo();toast('データを読み込みました',undo);
}

/* add / edit sheet */
function tdOpenSheet(mode,type,id,preset){
  preset=preset||{};
  var S={mode:mode,type:type,id:id||null,due:preset.due||'',zone:preset.zone||'today',color:'teal',days:[0,1,2,3,4,5,6]},text='',memo='',x;
  if(mode==='edit'){
    if(type==='task'){x=tdFindTask(id);if(!x)return;text=x.text;memo=x.memo||'';S.due=x.due||'';S.zone=tdZone(x);S.color=tdColor(x)}
    else{x=tdFindHabit(id);if(!x)return;text=x.name;if(x.days&&x.days.length)S.days=x.days.slice()}
  }
  var edit=mode==='edit';
  var s=openSheet('<form autocomplete="off">'+
    (edit?'':'<div class="td-seg" id="tdSeg"><button type="button" data-ty="task">タスク</button><button type="button" data-ty="habit">習慣</button></div>')+
    '<label class="fld"><span id="tdLab">やること</span><input id="tdText" maxlength="80" enterkeyhint="done" value="'+esc(text)+'"></label>'+
    '<div id="tdMemoBox"><label class="fld">メモ（任意）<textarea id="tdMemo" rows="2" maxlength="400" placeholder="詳しいことや持ち物など">'+esc(memo)+'</textarea></label></div>'+
    '<div id="tdDueBox"><span class="td-lab">期限（任意。欄とは別に設定できます）</span><div class="td-chips">'+
      '<button type="button" class="td-pick" data-due="today">今日</button><button type="button" class="td-pick" data-due="tomorrow">明日</button><button type="button" class="td-pick" data-due="none">期限なし</button>'+
      '<input type="date" id="tdDate" aria-label="日付を選ぶ"></div></div>'+
    '<div id="tdZoneBox"><span class="td-lab">表示する欄（期限に関係なく選べます）</span><div class="td-chips">'+
      TZONES.map(function(z){return '<button type="button" class="td-pick" data-zone="'+z[0]+'">'+z[1]+'</button>'}).join('')+'</div></div>'+
    '<div id="tdColorBox"><span class="td-lab">色</span><div class="td-swatches">'+
      TCOL.map(function(c){return '<button type="button" class="td-sw" data-c="'+c[0]+'" style="--tc:var(--c-'+c[0]+')" aria-label="'+c[1]+'">'+TCHECK_S+'</button>'}).join('')+'</div></div>'+
    '<div id="tdDaysBox"><span class="td-lab">曜日</span><div class="td-chips">'+
      TORDER.map(function(d){return '<button type="button" class="td-pick wd" data-d="'+d+'">'+WD[d]+'</button>'}).join('')+'</div></div>'+
    '<div class="btns">'+(edit?'<button type="button" class="btn dan" id="tdDel">削除</button>':'')+'<button type="button" class="btn" id="tdCancel">キャンセル</button><button class="btn pri">'+(edit?'保存':'追加')+'</button></div></form>');
  var q=function(sel){return $(sel,s)};
  var sync=function(){
    var hab=S.type==='habit',today=todayS(),dv={today:today,tomorrow:addDays(today,1),none:''};
    $$('#tdSeg button',s).forEach(function(b){b.classList.toggle('on',b.dataset.ty===S.type)});

/* drag & drop (つまみをドラッグ) */
function tdClearMarks(){$$('.over,.drop-before,.drop-after').forEach(function(x){x.classList.remove('over','drop-before','drop-after')})}
function tdDragStart(e,grip){
  if(tdd)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var row=grip.closest('[data-item]');if(!row)return;
  e.preventDefault();
  var r=row.getBoundingClientRect(),gh=row.cloneNode(true);
  gh.removeAttribute('data-item');gh.classList.add('td-ghost');
  $$('.td-bls,.td-bladd',gh).forEach(function(x){x.remove()});
  gh.style.width=r.width+'px';gh.style.left=r.left+'px';gh.style.top=r.top+'px';
  document.body.appendChild(gh);
  row.classList.add('dragging');document.body.classList.add('td-dragging');
  tdd={id:row.getAttribute('data-item'),kind:row.getAttribute('data-kind'),row:row,ghost:gh,grip:grip,pid:e.pointerId,
    dx:e.clientX-r.left,dy:e.clientY-r.top,x:e.clientX,y:e.clientY,zone:null,target:null,after:false,self:false,raf:0};
  try{grip.setPointerCapture(e.pointerId)}catch(err){}
  document.addEventListener('pointermove',tdMove);
  document.addEventListener('pointerup',tdEnd);
  document.addEventListener('pointercancel',tdCancel);
  tdd.raf=requestAnimationFrame(tdTick);
}
function tdMove(e){if(!tdd||e.pointerId!==tdd.pid)return;tdd.x=e.clientX;tdd.y=e.clientY;e.preventDefault()}
function tdUpdate(){
  tdClearMarks();
  tdd.zone=null;tdd.target=null;tdd.self=false;tdd.after=false;
  var el=document.elementFromPoint(tdd.x,tdd.y);if(!el||!el.closest)return;
  var zone=el.closest('[data-drop]');
  if(!zone||zone.getAttribute('data-drop')!==tdd.kind)return;
  tdd.zone=zone;zone.classList.add('over');
  var items=zone.querySelectorAll('[data-item]'),i,r,cand=null,after=false,rowEl=el.closest('[data-item]');
  if(rowEl&&zone.contains(rowEl)){r=rowEl.getBoundingClientRect();cand=rowEl;after=tdd.y>r.top+r.height/2}
  else{for(i=0;i<items.length;i++){r=items[i].getBoundingClientRect();cand=items[i];if(tdd.y<r.top+r.height/2){after=false;break}after=true}}
  if(!cand)return;
  if(cand===tdd.row){tdd.self=true;return}
  tdd.target=cand.getAttribute('data-item');tdd.after=after;
  cand.classList.add(after?'drop-after':'drop-before');
}
function tdTick(){
  if(!tdd)return;
  var sc=$('#todo'),y=tdd.y;
  if(sc){var r=sc.getBoundingClientRect();
    if(y<r.top+70)sc.scrollTop-=Math.ceil((r.top+70-y)/5);
    else if(y>r.bottom-110)sc.scrollTop+=Math.ceil((y-(r.bottom-110))/5)}
  tdd.ghost.style.left=(tdd.x-tdd.dx)+'px';tdd.ghost.style.top=(tdd.y-tdd.dy)+'px';
  tdUpdate();
  tdd.raf=requestAnimationFrame(tdTick);
}
function tdFinish(apply){
  var d=tdd;if(!d)return;
  cancelAnimationFrame(d.raf);
  document.removeEventListener('pointermove',tdMove);
  document.removeEventListener('pointerup',tdEnd);
  document.removeEventListener('pointercancel',tdCancel);
  try{d.grip.releasePointerCapture(d.pid)}catch(err){}
  if(d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
  d.row.classList.remove('dragging');document.body.classList.remove('td-dragging');
  tdClearMarks();tdd=null;
  if(apply&&d.zone&&!d.self){
    if(d.kind==='habit')tdMoveHabit(d.id,d.target,d.after);
    else if(d.kind==='tag')tdMoveTag(d.id,d.target,d.after);
    else tdMoveTask(d.id,d.zone.getAttribute('data-zone'),d.target,d.after);
  }
}
function tdEnd(e){if(!tdd||e.pointerId!==tdd.pid)return;tdd.x=e.clientX;tdd.y=e.clientY;tdUpdate();tdFinish(true)}
function tdCancel(e){if(!tdd||e.pointerId!==tdd.pid)return;tdFinish(false)}
$('#main').addEventListener('click',function(e){
  if(ui.view!=='todo')return;
  var el=e.target.closest('[data-act]');if(!el)return;

  if(d.getFullYear()===n.getFullYear())return (d.getMonth()+1)+'月'+d.getDate()+'日';

}

  mmEd={el:el,id:x.id,isNew:isNew,memo:x,color:x.color,hist:[{v:body.value,s:0}],hi:0,lastPush:0,saveT:0,pushed:false};
  if(isNew)setTimeout(function(){body.focus()},80);
  try{history.pushState({mmEd:1},'');mmEd.pushed=true}catch(e){}
  var commit=function(){
    clearTimeout(mmEd.saveT);mmEd.saveT=setTimeout(function(){mSave(false)},500);
  };
  title.addEventListener('input',commit);
  title.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();body.focus()}});
  body.addEventListener('input',function(e){
    var E=mmEd,now=Date.now(),v=body.value,s=body.selectionStart;
    E.hist=E.hist.slice(0,E.hi+1);
    var brk=e.data===' '||e.data==='　'||e.inputType==='insertLineBreak'||e.inputType==='insertParagraph';
    if(now-E.lastPush>900||brk||E.hist.length===1){E.hist.push({v:v,s:s});E.hi=E.hist.length-1;if(E.hist.length>200){E.hist.shift();E.hi--}}
    else{E.hist[E.hi]={v:v,s:s}}
    E.lastPush=now;mUndoBtns();commit();
  });
  el.addEventListener('click',function(e){
    var b=e.target.closest('[data-e]');if(!b)return;

    else if(k==='undo'||k==='redo'){
      var E=mmEd,ni=E.hi+(k==='undo'?-1:1);if(ni<0||ni>=E.hist.length)return;
      E.hi=ni;body.value=E.hist[ni].v;var p=Math.min(E.hist[ni].s,body.value.length);
      body.focus();try{body.setSelectionRange(p,p)}catch(_){}
      E.lastPush=0;mUndoBtns();commit();
    }
    else if(k==='color')mColorSheet();
    else if(k==='more')mMoreSheet();
  });

function mUndoBtns(){var E=mmEd;if(!E)return;$('[data-e=undo]',E.el).disabled=E.hi<=0;$('[data-e=redo]',E.el).disabled=E.hi>=E.hist.length-1}

function mMoreSheet(){

        var E=mmEd;if(!E)return;var x=mFind(E.id),u=snapshot();
        if(x){var a=memos();a.splice(a.indexOf(x),1);save()}
        E.memo={id:E.id};$('#mmTitle',E.el).value='';$('#mmBody',E.el).value='';
        mClose(false);if(x)toast('メモを削除しました',u);
      });
    }
  };
}
$('#main').addEventListener('click',function(e){
  if(ui.view!=='memo')return;
  var o=e.target.closest('[data-mm-open]');if(o){mOpen(o.dataset.mmOpen);return}
  var b=e.target.closest('[data-mm]');if(!b)return;
  switch(b.dataset.mm){
    case 'new':mOpen(null);break;
    case 'sort':mSortSheet();break;
    case 'filter':mFilterSheet();break;
    case 'search':mmSearch=!mmSearch;if(!mmSearch)mmQuery='';renderMemo();if(mmSearch)setTimeout(function(){var q=$('#mmQ');q&&q.focus()},30);break;
    case 'search-close':mmSearch=false;mmQuery='';renderMemo();break;
  }
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&mmEd)mSave(false)});

/* ---------- settings / backup ---------- */
function countTasks(st){var n=0;st.boards.forEach(function(b){b.lists.forEach(function(l){n+=l.tasks.length})});return n}
function settingsSheet(){
  var s=openSheet('<h3>メニュー</h3><p class="msg" style="font-size:13px;color:var(--sub)">データはこのスマホの中だけに保存されています（ボード'+state.boards.length+'枚・タスク'+countTasks(state)+'件）。機種変更やブラウザのデータ削除に備えて、ときどきバックアップを書き出してください。'+(ui.lastBackup?'<br>前回のバックアップ：'+esc(ui.lastBackup):'')+'</p>'+
    '<button class="menu-item" data-m="exp">バックアップを書き出す（ファイルに保存）</button>'+
    '<button class="menu-item" data-m="imp">バックアップから読み込む</button>'+
    '<input type="file" id="impFile" accept="application/json,.json" hidden>'+
    '<div class="btns"><button class="btn" data-m="close">閉じる</button></div>');
  var fi=$('#impFile',s);
  fi.onchange=function(){
    var file=fi.files&&fi.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      var data=null;try{data=JSON.parse(rd.result)}catch(e){}
      if(!valid(data)){toast('バックアップファイルを読み込めませんでした');return}
      confirmSheet('今のデータを、バックアップの内容（ボード'+data.boards.length+'枚・タスク'+countTasks(data)+'件）で置き換えますか？','置き換える',function(){
        var u=snapshot();state=data;ui.boardId=null;ui.collapsed={};save();renderAll();toast('読み込みました',u);
      });
    };
    rd.readAsText(file);
  };
  s.onclick=function(e){
    var m=e.target.closest('[data-m]');if(!m)return;m=m.dataset.m;
    if(m==='close'){closeSheet();return}
    if(m==='imp'){fi.click();return}
    if(m==='exp'){
      var d=new Date(),name='taskboard-backup-'+todayS()+'-'+pad(d.getHours())+pad(d.getMinutes())+'.json';
      var url=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));
      var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
      ui.lastBackup=todayS().replace(/-/g,'/')+' '+pad(d.getHours())+':'+pad(d.getMinutes());saveUI();
      closeSheet();toast('ダウンロードに保存しました');
    }
  };
}
$('#gear').addEventListener('click',settingsSheet);

renderAll();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
